name: Déploiement

# Déploiement manuel de dist/ vers https://totem.dolu.fr par FTPS.
# Par défaut : essai à blanc (liste ce qui serait envoyé ou supprimé, sans rien modifier).
# La version de package.json doit être publiable (X.Y.Z, en tête du journal src/release/changelog.ts,
# tag vX.Y.Z absent ou déjà sur ce commit) ; après un vrai déploiement, le tag vX.Y.Z est posé.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Essai à blanc (aucune modification sur le serveur)'
        type: boolean
        default: true

permissions:
  contents: write # pose du tag vX.Y.Z

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Contrôle de la version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version « $VERSION » non publiable : X.Y.Z attendu"
            exit 1
          fi
          # Lecture avec quelques essais (erreurs d'authentification passagères de l'API GitHub).
          TAGGED=""
          for i in 1 2 3; do
            if OUT=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>&1); then
              TAGGED=$OUT; break
            elif grep -q "HTTP 404\|HTTP 422" <<<"$OUT"; then
              break
            fi
            sleep $((i * 5))
          done
          if [ -z "$TAGGED" ]; then
            echo "tag=new" >> "$GITHUB_OUTPUT"
          elif [ "$TAGGED" = "$GITHUB_SHA" ]; then
            echo "::notice::v$VERSION déjà publiée sur ce commit : redéploiement"
            echo "tag=existing" >> "$GITHUB_OUTPUT"
          else
            echo "::error::v$VERSION est déjà publiée sur un autre commit ($TAGGED) : monter la version et compléter le journal"
            exit 1
          fi

      - name: Installation des dépendances
        run: npm ci

      - name: Contrôles (lint, formats, types, tests)
        run: npm run check

      - name: Build de production
        run: npm run build

      - name: Contrôle du build (pas de crochets de test, fichiers attendus)
        run: |
          if grep -rq __totem dist/; then
            echo "::error::Les crochets de test (__totem) sont présents dans dist/"
            exit 1
          fi
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/version.json
          # version.json doit toujours venir du réseau : jamais dans le précache.
          if grep -q version.json dist/sw.js; then
            echo "::error::version.json est précaché par le service worker"
            exit 1
          fi

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déploiement FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # FTPS explicite obligatoire, certificat vérifié.
          # .well-known (renouvellement AutoSSL), cgi-bin, .htaccess, .user.ini et php.ini
          # (configuration de l'hébergeur) ne sont jamais supprimés.
          # Les ressources partent d'abord ; index.html et sw.js en dernier, pour qu'aucun
          # visiteur ne reçoive une page qui référence des fichiers pas encore arrivés.
          MIRROR="mirror --reverse --delete --no-perms --parallel=2 --verbose"
          MIRROR="$MIRROR --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .htaccess"
          MIRROR="$MIRROR --exclude-glob .ftpquota --exclude-glob .user.ini --exclude-glob php.ini"
          MIRROR="$MIRROR --exclude-glob index.html --exclude-glob sw.js"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Essai à blanc : rien n'est modifié sur le serveur"
            MIRROR="$MIRROR --dry-run"
            FINAL="echo '(essai à blanc) envoi de index.html et sw.js ignoré'"
          else
            FINAL="put dist/index.html -o index.html; put dist/sw.js -o sw.js"
          fi

          lftp -u "$FTP_USER,$FTP_PASSWORD" -p 21 "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-auth TLS
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:timeout 20
          echo "--- Contenu actuel de la racine du compte ---"
          cls -l
          echo "--- Synchronisation ---"
          $MIRROR dist/ ./
          $FINAL
          bye
          EOF

      - name: Vérification du site en ligne
        if: ${{ !inputs.dry_run }}
        run: |
          curl -fsS -o /dev/null -w "index : %{http_code}\n" https://totem.dolu.fr/
          curl -fsS -o /dev/null -w "sw.js : %{http_code}\n" https://totem.dolu.fr/sw.js
          curl -fsS https://totem.dolu.fr/version.json | node -e "
            const v = JSON.parse(require('fs').readFileSync(0, 'utf8')).version;
            if (v !== '${{ steps.version.outputs.version }}') { console.error('version.json en ligne : ' + v); process.exit(1); }
            console.log('version.json : ' + v);"

      - name: Tag de la version
        if: ${{ !inputs.dry_run && steps.version.outputs.tag == 'new' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Essais répétés : l'API GitHub renvoie parfois un 401 passager sur les écritures.
          for i in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" >/dev/null; then
              echo "::notice::Tag v$VERSION posé sur $GITHUB_SHA"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::warning::Tag v$VERSION non posé : le créer à la main (git tag v$VERSION $GITHUB_SHA && git push origin v$VERSION)"
